[package]
name = "spin-sim"
version = "0.2.1"
edition = "2021"
description = "Ising and XY Monte Carlo: Metropolis, Gibbs, Swendsen-Wang, Wolff, parallel tempering, Houdayer/Jörg/CMR and replica Monte Carlo overlap moves"
license = "MIT"
readme = "README.md"
repository = "https://github.com/PeaBrane/peapods"
keywords = ["ising", "monte-carlo", "spin-glass", "parallel-tempering", "cluster-algorithm"]
categories = ["science", "simulation"]

[features]
profile = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("profile"))'] }

[dependencies]
rand = "0.8"
rand_xoshiro = "0.6"
rayon = "1.10"
rustfft = "6.2"
validator = { version = "0.16", features = ["derive"] }
