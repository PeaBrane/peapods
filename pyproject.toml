[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "peapods"
version = "0.2.1"
description = "Ising and XY Monte Carlo with signed couplings, cluster updates, parallel tempering and physical statistics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.scripts]
peapods = "peapods.cli:main"

[tool.maturin]
python-source = "python"
module-name = "peapods._core"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
